name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and build
        run: |
          xcodegen generate
          xcodebuild -project KeepAwakeMac.xcodeproj -scheme KeepAwakeMac -configuration Debug -derivedDataPath build ENABLE_HARDENED_RUNTIME=NO CODE_SIGN_IDENTITY=- build
      - name: Run simulated power and task checks
        run: bash scripts/check-helper.sh
      - name: Render every menu state and prove the warning banner is drawn
        run: bash scripts/check-menu.sh "$(mktemp -d)"
