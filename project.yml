name: KeepAwakeMac
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEAD_CODE_STRIPPING: YES
      ENABLE_NS_ASSERTIONS: NO
      ONLY_ACTIVE_ARCH: NO

targets:
  KeepAwakeMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["*.entitlements*"]
      - path: Shared
      - path: packaging/com.local.KeepAwakeMac.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.KeepAwakeMac
        PRODUCT_NAME: KeepAwakeMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: KAMHelper
        copy:
          destination: plugins
    scheme:
      testTargets: []
      gatherCoverageData: false

  KAMHelper:
    type: xpc-service
    platform: macOS
    sources:
      - path: Helper
        excludes: ["*.entitlements*"]
      - path: Shared
    info:
      path: Helper/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.KeepAwakeMac.Helper
        PRODUCT_NAME: KAMHelper
        SKIP_INSTALL: YES
